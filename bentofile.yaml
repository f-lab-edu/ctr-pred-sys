service: "src.serving.service:ModelService"
description: "The ctr prediction model serving pipeline using bentoml."
include:
  - "configs/*"
  - "src/**/*.py"
  - "data/**/*"
python:
  packages:
    - bentoml==1.3.18
    - pyyaml==6.0.1
    - numpy==1.24.3
    - pandas==1.5.3
    - torch==1.13.1
    - scikit-learn==1.2.2
    - lightgbm==4.5.0
envs:
  - name: PYTHONPATH
    value: .